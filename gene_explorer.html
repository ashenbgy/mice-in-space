<title>Space Mouse Gene Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap">
<style>
/* Layout: plain-language primer band, then search + gene card on the left, volcano plot on the right; stacks on phones. Palette from the notebook's chart colors. */
:root {
  --bg: #FCE4EC; --surface: #FFF5F8; --ink: #3A1C2B; --muted: #8C6B76;
  --pink: #E8447A; --line: #EBC4D2; --cloud: rgba(140,107,118,.28); --warn-bg: #FFF1D6; --warn: #7A4B00;
  --display: "Bricolage Grotesque", "Noto Sans Sinhala", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", "Noto Sans Sinhala", "Helvetica Neue", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Noto Sans Sinhala", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1E0F17; --surface: #2A1621; --ink: #F7DCE6; --muted: #B8949F;
  --pink: #FF5C93; --line: #4A2A39; --cloud: rgba(184,148,159,.25); --warn-bg: #3A2A0E; --warn: #F2C46B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1E0F17; --surface: #2A1621; --ink: #F7DCE6; --muted: #B8949F;
  --pink: #FF5C93; --line: #4A2A39; --cloud: rgba(184,148,159,.25); --warn-bg: #3A2A0E; --warn: #F2C46B; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px; }
header { display: grid; gap: 8px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px; }
.lang button { font: 600 13px var(--body); border: 0; background: transparent; color: var(--ink); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lang button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
h1 { font: 700 clamp(28px, 4.5vw, 44px)/1.15 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 em { font-style: normal; color: var(--pink); }
.lede { margin: 0; max-width: 64ch; color: var(--muted); font-size: 16px; }
.primer { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; border-block: 1.5px solid var(--line); padding-block: 18px; }
@media (max-width: 900px) { .primer { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .primer { grid-template-columns: minmax(0, 1fr); } }
.primer h3 { font: 700 16px/1.3 var(--display); margin: 0 0 4px; }
.primer p { margin: 0; font-size: 14px; color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { display: grid; gap: 16px; min-width: 0; }
.lbl { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.search { display: grid; gap: 6px; position: relative; }
#q { font: 500 18px var(--mono); padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); width: 100%; box-sizing: border-box; }
#q:focus { outline: none; border-color: var(--pink); }
#sugg { list-style: none; margin: 0; padding: 4px; position: absolute; top: 100%; left: 0; right: 0; z-index: 5;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; max-height: 280px; overflow-y: auto; }
#sugg li { padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
#sugg li[aria-selected="true"], #sugg li:hover { background: var(--bg); }
#sugg b { font: 500 14px var(--mono); }
#sugg span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chipbox { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: 500 13px var(--mono); padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--line);
  background: transparent; color: var(--ink); cursor: pointer; }
.chips button:hover, .chips button:focus-visible { border-color: var(--pink); outline: none; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.card h2 { font: 700 30px/1 var(--display); margin: 0; }
.fullname { color: var(--muted); margin: -8px 0 0; font-size: 14px; }
.verdict { display: inline-flex; align-self: start; justify-self: start; font: 600 12px var(--body); letter-spacing: .04em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.v-up { background: var(--pink); color: #fff; }
.v-down { background: var(--ink); color: var(--bg); }
.v-none { border: 1.5px solid var(--muted); color: var(--muted); }
.big { font: 700 40px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.big small { font: 400 15px var(--body); color: var(--muted); margin-left: 6px; }
.plain { margin: 0; font-size: 16px; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 88px 1fr 72px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 12px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 3px; }
.bar .n { font: 400 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
dt { color: var(--muted); font-size: 13px; }
dd { margin: 0; font: 400 14px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.note { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.card a { color: var(--pink); font-size: 13px; }
.plotbox { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; display: grid; gap: 8px; }
.plothead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.howto { margin: 0; font-size: 14px; }
#plot { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; display: block; cursor: crosshair; touch-action: manipulation; }
#tip { font: 400 13px var(--mono); color: var(--muted); min-height: 1.4em; }
footer { color: var(--muted); font-size: 12px; max-width: 80ch; display: grid; gap: 6px; }
footer p { margin: 0; }
</style>

<div class="wrap">
  <header>
    <div class="top">
      <div class="eyebrow" data-t="eyebrow"></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en">English</button>
        <button type="button" id="lang-si" data-lang="si">සිංහල</button>
      </div>
    </div>
    <h1 data-h="title"></h1>
    <p class="lede" data-t="lede"></p>
  </header>

  <section class="primer">
    <div><h3 data-t="p1h"></h3><p data-t="p1"></p></div>
    <div><h3 data-t="p2h"></h3><p data-t="p2"></p></div>
    <div><h3 data-t="p3h"></h3><p data-t="p3"></p></div>
    <div><h3 data-t="p4h"></h3><p data-t="p4"></p></div>
  </section>

  <div class="grid">
    <section class="panel">
      <div class="search">
        <label class="lbl" for="q" data-t="find"></label>
        <input id="q" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-controls="sugg" aria-expanded="false">
        <ul id="sugg" role="listbox" hidden></ul>
      </div>
      <div class="chipbox">
        <span class="lbl" data-t="clockLbl"></span>
        <div class="chips"></div>
      </div>
      <article class="card" id="card" aria-live="polite"></article>
    </section>

    <section class="plotbox">
      <div class="plothead">
        <div class="legend">
          <span><i style="background:var(--pink)"></i><span data-t="lgUp"></span></span>
          <span><i style="background:var(--ink)"></i><span data-t="lgDown"></span></span>
          <span><i style="background:var(--muted);opacity:.5"></i><span data-t="lgNone"></span></span>
        </div>
        <span id="counts"></span>
      </div>
      <p class="howto" data-t="howto"></p>
      <canvas id="plot"></canvas>
      <div id="tip"></div>
    </section>
  </div>

  <footer>
    <p data-t="f1"></p>
    <p data-t="f2"></p>
    <p data-t="f3"></p>
  </footer>
</div>

    f1: "ජානයක් වෙනස් වූවා ලෙස ගණන් ගන්නේ එය අවම වශයෙන් ගුණ 2ක් වැඩියෙන් හෝ අඩුවෙන් භාවිතා වී, එය අහම්බයක් වීමේ ඉඩ (adjusted p) 0.05ට අඩු නම් පමණයි. \"වැඩියි\" කියන්නේ සැමවිටම අභ්‍යවකාශයේ වැඩියි කියන එකයි. මූලාශ්‍ර ගොනුවේ පෘථිවි කණ්ඩායම මුලින් ඇති නිසා ලකුණ මාරු කළා. 1,024×ට වඩා දුර තිත් දාරයේ තබා ඇත.",

let lang = "en";
try { lang = localStorage.getItem("lang") || (navigator.language.startsWith("si") ? "si" : "en"); } catch {}
const t = k => T[lang][k];

const genes = DATA.map(([sym, name, fc, p, g, f]) => ({ sym, name, fc, p, g, f, y: -Math.log10(Math.max(p, 1e-300)),
  dir: p < .05 && fc > 1 ? "up" : p < .05 && fc < -1 ? "down" : "none" }));
const bySym = new Map(genes.map(d => [d.sym.toLowerCase(), d]));
const YMAX = Math.ceil(Math.max(...genes.map(d => d.y)) / 5) * 5;
const nUp = genes.filter(d => d.dir === "up").length, nDown = genes.filter(d => d.dir === "down").length;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const times = fc => { const x = 2 ** Math.abs(fc); return x >= 1000 ? Math.round(x).toLocaleString() : x.toFixed(1); };
const fmtP = p => p < 1e-3 ? p.toExponential(1) : p.toFixed(3);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// plot
const cv = document.getElementById("plot"), ctx = cv.getContext("2d");
const M = { l: 40, r: 18, t: 12, b: 40 };
let W = 0, H = 0, sel = null, hover = null;
const sx = x => M.l + (Math.max(-XMAX, Math.min(XMAX, x)) + XMAX) / (2 * XMAX) * (W - M.l - M.r);
const sy = y => H - M.b - y / YMAX * (H - M.t - M.b);

function draw() {
  const dpr = devicePixelRatio || 1, r = cv.getBoundingClientRect();
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ink = css("--ink"), muted = css("--muted"), pink = css("--pink"), line = css("--line");
  ctx.clearRect(0, 0, W, H);
  ctx.font = `11px ${css("--mono")}`; ctx.fillStyle = muted; ctx.strokeStyle = line; ctx.lineWidth = 1;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  // x ticks every log2 step of 2, labelled as plain "times" (4×, 16×, ...)
  const step = W < 420 ? 4 : 2;
  for (let x = -XMAX + (XMAX % step); x <= XMAX; x += step) {
    ctx.beginPath(); ctx.moveTo(sx(x), M.t); ctx.lineTo(sx(x), H - M.b); ctx.stroke();
    ctx.fillText(x === 0 ? t("same") : (2 ** Math.abs(x)).toLocaleString() + "×", sx(x), H - M.b + 6);
  }
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let y = 0; y <= YMAX; y += 5) {
    ctx.beginPath(); ctx.moveTo(M.l, sy(y)); ctx.lineTo(W - M.r, sy(y)); ctx.stroke();
    ctx.fillText(y, M.l - 6, sy(y));
  }
  ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillText(t("axX"), (M.l + W - M.r) / 2, H - 2);
  ctx.save(); ctx.translate(10, (M.t + H - M.b) / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = "middle";
  ctx.fillText(t("axY"), 0, 0); ctx.restore();
  // cutoffs: 2× either way, p = 0.05
  ctx.setLineDash([3, 3]); ctx.strokeStyle = muted; ctx.globalAlpha = .6;
  [[sx(-1), M.t, sx(-1), H - M.b], [sx(1), M.t, sx(1), H - M.b], [M.l, sy(-Math.log10(.05)), W - M.r, sy(-Math.log10(.05))]]
    .forEach(([a, b, c, d]) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); });
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  ctx.fillStyle = css("--cloud");
  for (const d of genes) if (d.dir === "none") ctx.fillRect(sx(d.fc) - 1, sy(d.y) - 1, 2, 2);
  for (const d of genes) if (d.dir !== "none") {
    ctx.fillStyle = d.dir === "up" ? pink : ink;
    ctx.beginPath(); ctx.arc(sx(d.fc), sy(d.y), 2.6, 0, 7); ctx.fill();
  }
  for (const [d, main] of [[hover, false], [sel, true]]) {
    if (!d) continue;
    const x = sx(d.fc), y = sy(d.y);
    ctx.strokeStyle = pink; ctx.lineWidth = main ? 2.5 : 1.5;
    ctx.beginPath(); ctx.arc(x, y, main ? 8 : 6, 0, 7); ctx.stroke();
    if (main) {
      ctx.font = `600 13px ${css("--mono")}`; ctx.fillStyle = ink; ctx.textBaseline = "middle";
      const right = x < W - 90; ctx.textAlign = right ? "left" : "right";
      ctx.fillText(d.sym, x + (right ? 12 : -12), Math.max(M.t + 8, y));
    }
  }
}

function nearest(e) {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 144;
  for (const d of genes) { const dx = sx(d.fc) - mx, dy = sy(d.y) - my, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = d; } }
  return best;
}
const tip = document.getElementById("tip");
const tipFor = d => d ? `${d.sym} · ${times(d.fc)}× ${d.fc > 0 ? t("more") : t("less")} · p ${fmtP(d.p)}` : t("tip");
cv.addEventListener("mousemove", e => { const d = nearest(e); if (d === hover) return; hover = d; draw(); tip.textContent = tipFor(d); });
cv.addEventListener("mouseleave", () => { hover = null; draw(); tip.textContent = t("tip"); });
cv.addEventListener("click", e => { const d = nearest(e); if (d) show(d); });

// detail card
function show(d) {
  sel = d; draw();
  document.getElementById("q").value = d.sym;
  try { history.replaceState(null, "", "#" + d.sym); } catch {}
  const g = esc(d.sym), x = times(d.fc);
  const verdict = { up: ["v-up", t("vUp")], down: ["v-down", t("vDown")], none: ["v-none", t("vNone")] }[d.dir];
  const sentence = d.dir === "up" ? t("sUp")(g, x) : d.dir === "down" ? t("sDown")(g, x) : d.p >= .05 ? t("sLuck")(g) : t("sSmall")(g);
  const max = Math.max(d.g, d.f, 1);
  const low = Math.max(d.g, d.f) < LOW, tiny = Math.min(d.g, d.f) < 1 && Math.abs(d.fc) > 4;
  document.getElementById("card").innerHTML = `
    <span class="verdict ${verdict[0]}">${verdict[1]}</span>
    <h2>${g}</h2>
    ${d.name ? `<p class="fullname">${esc(d.name)}</p>` : ""}
    <div class="big">${x}×<small>${d.fc > 0 ? t("more") : t("less")}</small></div>
    <p class="plain">${sentence}</p>
    <div class="bars">
      <span class="lbl">${t("barsLbl")}</span>
      ${[[t("earth"), d.g, css("--muted")], [t("space"), d.f, css("--pink")]].map(([l, v, c]) => `
        <div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${v / max * 100}%;background:${c}"></div></div><span class="n">${v.toLocaleString()}</span></div>`).join("")}
    </div>
    <dl>
      <dt>${t("dFc")}</dt><dd>${d.fc > 0 ? "+" : ""}${d.fc.toFixed(2)}</dd>
      <dt>${t("dP")}</dt><dd>${fmtP(d.p)}</dd>
      <dt>${t("dReal")}</dt><dd>${d.dir !== "none" ? t("yes") : t("no")}</dd>
    </dl>
    ${CLOCK.includes(d.sym) || ["Per2", "Cry2", "Nr1d2", "Hlf"].includes(d.sym) ? `<div class="note">${t("clockNote")}</div>` : ""}
    ${low || tiny ? `<div class="warn">${low ? t("wLow") : t("wTiny")} ${t("wRest")}</div>` : ""}
    <a href="https://www.ncbi.nlm.nih.gov/gene/?term=${encodeURIComponent(d.sym)}%5Bsym%5D+AND+mouse%5Borgn%5D" target="_blank" rel="noopener">${t("ncbi")(g)}</a>`;
}

// search
const q = document.getElementById("q"), sugg = document.getElementById("sugg");
let hits = [], active = -1;
function renderSugg() {
  sugg.hidden = !hits.length; q.setAttribute("aria-expanded", String(!!hits.length));
  sugg.innerHTML = hits.map((d, i) => `<li role="option" data-i="${i}" aria-selected="${i === active}"><b>${esc(d.sym)}</b><span>${esc(d.name)}</span></li>`).join("");
}
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase(); active = -1;
  hits = !s ? [] : genes.filter(d => d.sym.toLowerCase().startsWith(s))
    .concat(s.length > 2 ? genes.filter(d => !d.sym.toLowerCase().startsWith(s) && d.name.toLowerCase().includes(s)) : [])
    .slice(0, 12);
  renderSugg();
});
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!hits.length) return;
    active = (active + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; renderSugg(); }
  else if (e.key === "Enter") { const d = hits[Math.max(active, 0)] || bySym.get(q.value.trim().toLowerCase()); if (d) { show(d); hits = []; renderSugg(); } }
  else if (e.key === "Escape") { hits = []; renderSugg(); }
});
sugg.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); show(hits[+li.dataset.i]); hits = []; renderSugg(); } });
q.addEventListener("blur", () => { hits = []; renderSugg(); });

const chips = document.querySelector(".chips");
for (const s of CLOCK) { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => show(bySym.get(s.toLowerCase())); chips.append(b); }

// language
function applyLang(l) {
  lang = l; try { localStorage.setItem("lang", l); } catch {}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-h]").forEach(el => el.innerHTML = t(el.dataset.h));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  q.placeholder = t("ph");
  cv.setAttribute("aria-label", t("howto"));
  document.getElementById("counts").textContent = t("counts")(nUp, nDown, genes.length.toLocaleString());
  tip.textContent = t("tip");
  if (sel) show(sel); else draw();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => applyLang(b.dataset.lang));

new ResizeObserver(draw).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
document.fonts?.ready.then(draw);
sel = bySym.get(location.hash.slice(1).toLowerCase()) || bySym.get("npas2");
applyLang(T[lang] ? lang : "en");
</script>
